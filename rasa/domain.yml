version: "3.1"

intents:
  - cung_cap_thong_tin
  - dat_ve
  - dong_y
  - huy
  - tu_choi
  - sua_thong_tin
  - chao_hoi

entities:
  - dia_diem
  - thoi_gian
  - loai_xe
  - so_luong
  - ho_ten
  - dien_thoai

slots:
  diem_don:
    type: text
    mappings:
      - type: custom
  diem_den:
    type: text
    mappings:
      - type: custom
  thoi_gian:
    type: text
    mappings:
      - type: custom
  loai_xe:
    type: text
    mappings:
      - type: custom
    initial_value: "xe limousine"
  so_luong:
    type: text
    mappings:
      - type: custom
  ho_ten:
    type: text
    mappings:
      - type: custom
  dien_thoai:
    type: text
    mappings:
      - type: custom
  # Biến lưu thông tin lấy được ở server
  list_tickets:
    type: any
    mappings:
      - type: custom
  # Biến dùng để xác định có thông tin cần sửa
  has_lists:
    type: bool
    mappings:
      - type: custom
  # Biến dùng để đánh dấu xác nhận form
  confirm_form:
    type: bool
    initial_value: false
    mappings:
      - type: custom
  # Biến đùng để đánh dấu trạng thái form
  status_form:
    type: text
    mappings:
      - type: custom
  # Biến dùng để phân biệt các form
  flag_form:
    type: text
    mappings:
      - type: custom
forms:
  form_dat_ve:
    ignored_intents:
      - chao_hoi
    required_slots:
      - diem_don
      - diem_den
      - thoi_gian
      - loai_xe
      - so_luong
      - ho_ten
      - dien_thoai

responses:
  utter_ask_form_dat_ve_diem_don:
    - text: "anh chị muốn được đón ở đâu ạ"

  utter_ask_form_dat_ve_diem_den:
    - text: "anh chị muốn đi đến đâu ạ"

  utter_ask_form_dat_ve_thoi_gian:
    - text: "anh chị muốn đón vào lúc nào ạ"

  utter_ask_form_dat_ve_loai_xe:
    - text: "anh chị muốn loại xe nào ạ"

  utter_ask_form_dat_ve_so_luong:
    - text: "anh chị đi bao nhiêu người ạ"

  utter_ask_form_dat_ve_ho_ten:
    - text: "anh chị vui lòng cung cấp họ tên ạ"

  utter_ask_form_dat_ve_dien_thoai:
    - text: "anh chị có muốn dùng số điện thoại này để đặt vé không. nếu không anh chị vui lòng cung cấp số điện thoại đặt vé ạ"

  utter_ask_form_sua_ve_diem_don:
    - text: "anh chị muốn được đón ở đâu ạ"

  utter_ask_form_sua_ve_diem_den:
    - text: "anh chị muốn đi đến đâu ạ"

  utter_ask_form_sua_ve_thoi_gian:
    - text: "anh chị muốn đón vào lúc nào ạ"

  utter_ask_form_sua_ve_loai_xe:
    - text: "anh chị muốn loại xe nào ạ"

  utter_ask_form_sua_ve_so_luong:
    - text: "anh chị đi bao nhiêu người ạ"

  utter_ask_form_sua_ve_ho_ten:
    - text: "anh chị vui lòng cung cấp họ tên ạ"

  utter_ask_form_sua_ve_dien_thoai:
    - text: "anh chị có muốn dùng số điện thoại này để đặt vé không. nếu không anh chị vui lòng cung cấp số điện thoại đặt vé ạ"

  utter_ask_form_huy_ve_dien_thoai:
    - text: "anh chị vui lòng cung cấp số điện thoại lúc đặt vé ạ"

  utter_ask_form_huy_ve_thoi_gian:
    - text: "vui lòng anh chị cung cấp thời gian đi ạ"

  utter_ask_form_huy_ve_ho_ten:
    - text: "vui lòng anh chị cung cấp họ tên người đặt vé ạ"

  utter_ask_form_huy_ve_diem_don:
    - text: "vui lòng anh chị cung cấp điểm đón ạ"

  utter_ask_form_huy_ve_diem_den:

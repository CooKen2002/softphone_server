  utter_fallback:
    - text: "xin lỗi, tôi chưa hiểu ý anh, chị. anh, chị có thể nói lại không ạ"

  utter_default_fallback:
    - text: "xin lỗi, tôi chưa hiểu ý anh, chị. anh, chị có thể nói lại không ạ"

actions:
  - validate_form_dat_ve
  - action_tra_cuu_ve
  - action_submit_form_dat_ve
  - action_xac_nhan_form_dat_ve
  - action_sua_thong_tin_form_dat_ve

  - action_submit_form_huy_ve
  - action_xac_nhan_form_huy_ve
  - action_sua_thong_tin_form_huy_ve

  - action_submit_form_sua_ve
  - action_xac_nhan_form_sua_ve
  - action_sua_thong_tin_form_sua_ve
  - action_reset_form

  - action_chao_hoi
  - action_route_action

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

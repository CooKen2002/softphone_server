recipe: default.v1
assistant_id: Anvt
language: vi

pipeline:
  - name: components.sks_tokenizer.sks_tokenizer.SKS_tokenizer
    base_path: "./components/sks_tokenizer"
  - name: components.countVectorsFeaturizer.SKS_CountVectorsFeaturizer

  - name: DIETClassifier
    epochs: 50
    constrain_similarities: true
    entity_recognition: true
    intent_classification: true
    embedding_dimension: 32
    number_of_transformer_layers: 2

  - name: EntitySynonymMapper

  # Custom components hậu xử lý
  - name: components.postProcess.PostProcess

  # - name: FallbackClassifier
  #   threshold: 0.7

  # - name: ResponseSelector
  #   epochs: 50

policies:
  #   - name: MemoizationPolicy

  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true

  - name: TEDPolicy
    max_history: 5
    epochs: 10
